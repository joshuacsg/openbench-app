name: FastPort
options:
  bundleIdPrefix: com.joshiee.fastport
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

targets:
  FastPort:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    info:
      path: iOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: FastPort
        NSLocalNetworkUsageDescription: "FastPort needs local network access to discover and connect to hosts."
        NSBonjourServices:
          - _flux._udp.
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.joshiee.fastport
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_STYLE: Automatic

  FastPort Viewer:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: "FastPort Viewer"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.joshiee.fastport.viewer
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_STYLE: Automatic

  FastPort Host:
    type: application
    platform: macOS
    sources:
      - Host
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.joshiee.fastport.host
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_CFBundleDisplayName: "FastPort Host"
      INFOPLIST_KEY_LSUIElement: true
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "FastPort Host needs local network access to advertise and serve connections."
      INFOPLIST_KEY_NSScreenCaptureUsageDescription: "FastPort Host captures your screen to stream to connected viewers."
      INFOPLIST_KEY_NSAccessibilityUsageDescription: "FastPort Host needs Accessibility to inject mouse and keyboard input from connected viewers."
      CODE_SIGN_STYLE: Automatic
